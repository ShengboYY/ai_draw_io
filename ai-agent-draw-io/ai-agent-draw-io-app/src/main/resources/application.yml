spring:
  config:
    # Load local settings for IntelliJ and Maven launches; the file remains optional for CI.
    import: optional:file:.env[.properties]
    name: ai-agent-draw-io-app
  profiles:
    active: dev

# 会话身份 (#3): 7 天登录有效期; cookie HttpOnly + SameSite=Lax，并由 CSRF token 保护写操作。
# 生产 profile 必须覆盖 server.servlet.session.cookie.secure=true (HTTPS-only)，
# 该 override 已在 application-prod.yml (gitignored) 中配置。
server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: AI_DRAWIO_SID
        http-only: true
        same-site: lax
        secure: false

# Account links rendered by the console email adapter in local development.
account:
  email:
    sender: ${ACCOUNT_EMAIL_SENDER:console}
    from: ${ACCOUNT_EMAIL_FROM:}
    reply-to: ${ACCOUNT_EMAIL_REPLY_TO:}
    region: ${ACCOUNT_EMAIL_REGION:${AWS_REGION:ap-southeast-2}}
  verification:
    base-url: ${ACCOUNT_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}
  password-reset:
    base-url: ${ACCOUNT_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password/confirm}

# Comma/space separated normalized by the server. Empty means no admin access.
admin:
  emails: ${ADMIN_EMAILS:}
  allowed-origins: ${ADMIN_ALLOWED_ORIGINS:}
  # Evaluation role lists are subsets of ADMIN_EMAILS; omitted users retain Eval Admin privileges.
  eval-editor-emails: ${ADMIN_EVAL_EDITOR_EMAILS:}
  eval-reviewer-emails: ${ADMIN_EVAL_REVIEWER_EMAILS:}
  release-owner-emails: ${ADMIN_RELEASE_OWNER_EMAILS:}

app:
  security:
    # Credentialed CORS is restricted to known SPA origins; production should set this env var.
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  memory:
    # Enable only after the 20260814 database migration has completed.
    auto-enabled: ${AUTO_MEMORY_ENABLED:false}
    extractor-agent-id: ${AUTO_MEMORY_EXTRACTOR_AGENT_ID:300030}
    worker-delay-ms: ${AUTO_MEMORY_WORKER_DELAY_MS:5000}
    worker-batch-size: ${AUTO_MEMORY_WORKER_BATCH_SIZE:10}
  material-catalog:
    # Enable only after the WP1 foundation and WP4-A idempotency migration are applied.
    enabled: ${MATERIAL_CATALOG_ENABLED:false}
  material-lifecycle:
    # Keep lifecycle APIs and cleanup isolated from ordinary text drawing.
    enabled: ${MATERIAL_LIFECYCLE_ENABLED:false}
    deletion-confirmation-secret: ${MATERIAL_DELETION_CONFIRMATION_SECRET:}
    maintenance-delay-ms: ${MATERIAL_LIFECYCLE_MAINTENANCE_DELAY_MS:60000}
    batch-size: ${MATERIAL_LIFECYCLE_BATCH_SIZE:100}
  material-storage:
    storage: ${MATERIAL_UPLOAD_STORAGE:local}
    local-root: ${MATERIAL_LOCAL_ROOT:./data/material-objects}
  material-preview:
    # Page rendering and reprocessing remain isolated from ordinary text drawing.
    enabled: ${MATERIAL_PREVIEW_ENABLED:false}
    aws-region: ${MATERIAL_PREVIEW_AWS_REGION:${AWS_REGION:ap-southeast-2}}
    materials-bucket: ${MATERIALS_BUCKET:}
    processing-profile:
      # Must match the Worker profile that should own newly requested revisions.
      fingerprint: ${MATERIAL_PROCESSING_PROFILE_FINGERPRINT:}
      parser-version: ${MATERIAL_PROCESSING_PARSER_VERSION:}
      cleaner-version: ${MATERIAL_PROCESSING_CLEANER_VERSION:}
      chunk-schema-version: ${MATERIAL_PROCESSING_CHUNK_SCHEMA_VERSION:}
      ocr-version: ${MATERIAL_PROCESSING_OCR_VERSION:}
      vlm-schema-version: ${MATERIAL_PROCESSING_VLM_SCHEMA_VERSION:}
  material-rag:
    # WP5 remains fail-closed until migrations, lifecycle leases, material storage and optional Pinecone are configured.
    enabled: ${MATERIAL_RAG_ENABLED:false}
    citation-commit-enabled: ${MATERIAL_CITATION_COMMIT_ENABLED:false}
    evidence-answer-enabled: ${MATERIAL_EVIDENCE_ANSWER_ENABLED:false}
    dense-enabled: ${MATERIAL_RAG_DENSE_ENABLED:false}
    parallelism: ${MATERIAL_RAG_PARALLELISM:4}
    retrieval-timeout-ms: ${MATERIAL_RAG_RETRIEVAL_TIMEOUT_MS:3000}
    probe-timeout-ms: ${MATERIAL_RAG_PROBE_TIMEOUT_MS:300}
    hydration-timeout-ms: ${MATERIAL_RAG_HYDRATION_TIMEOUT_MS:800}
    aws-region: ${MATERIAL_RAG_AWS_REGION:${AWS_REGION:ap-southeast-2}}
    materials-bucket: ${MATERIALS_BUCKET:}
    pinecone:
      api-key: ${PINECONE_API_KEY:}
      index-host: ${PINECONE_INDEX_HOST:}
      namespace: ${PINECONE_NAMESPACE:prod}
      embedding-model: ${PINECONE_EMBEDDING_MODEL:multilingual-e5-large}
      dimension: ${PINECONE_DIMENSION:1024}
      tenant-hmac-secret: ${PINECONE_TENANT_HMAC_SECRET:}
  material-upload:
    # Local storage keeps development independent from AWS; production can opt into "s3".
    enabled: ${MATERIAL_UPLOAD_ENABLED:false}
    anonymous-enabled: ${MATERIAL_UPLOAD_ANONYMOUS_ENABLED:false}
    storage: ${MATERIAL_UPLOAD_STORAGE:local}
    local-root: ${MATERIAL_UPLOAD_LOCAL_ROOT:./data/material-uploads}
    local-bucket: ${MATERIAL_UPLOAD_LOCAL_BUCKET:quarantine}
    aws-region: ${MATERIAL_UPLOAD_AWS_REGION:${AWS_REGION:ap-southeast-2}}
    quarantine-bucket: ${MATERIAL_UPLOAD_QUARANTINE_BUCKET:}
    owner-path-secret: ${MATERIAL_UPLOAD_OWNER_PATH_SECRET:}
    rate-key-secret: ${MATERIAL_UPLOAD_RATE_KEY_SECRET:}
    max-batch-files: ${MATERIAL_UPLOAD_MAX_BATCH_FILES:10}
  material-visual-observation:
    # Online visual fact verification remains independently fail-closed until its model adapter is deployed.
    enabled: ${MATERIAL_VISUAL_OBSERVATION_ENABLED:false}
    timeout-ms: ${MATERIAL_VISUAL_OBSERVATION_TIMEOUT_MS:30000}
    aws-region: ${MATERIAL_VISUAL_AWS_REGION:${MATERIAL_RAG_AWS_REGION:${AWS_REGION:ap-southeast-2}}}
    materials-bucket: ${MATERIAL_VISUAL_MATERIALS_BUCKET:${MATERIALS_BUCKET:}}
  material-direct-image-conversion:
    # Image reconstruction depends on verified visual observation and never enables retrieval by itself.
    enabled: ${MATERIAL_DIRECT_IMAGE_CONVERSION_ENABLED:false}
  material-operations:
    # Anonymous upload is admitted only after the pinned WP8 release report is approved.
    enabled: ${MATERIAL_OPERATIONS_ENABLED:false}
    ingestion-enabled: ${MATERIAL_INGESTION_ROLLOUT_ENABLED:false}
    retrieval-shadow-enabled: ${MATERIAL_RETRIEVAL_SHADOW_ENABLED:false}
    release-approved: ${MATERIAL_RELEASE_APPROVED:false}
    release-report-version: ${MATERIAL_RELEASE_REPORT_VERSION:}
    refresh-ms: ${MATERIAL_OPERATIONS_REFRESH_MS:30000}
    capacity:
      monthly-indexed-pages-limit: ${MATERIAL_MONTHLY_INDEXED_PAGES_LIMIT:7000}
      # The authenticated billing exporter must refresh the live feed before this age expires.
      provider-max-age-seconds: ${MATERIAL_PROVIDER_CAPACITY_MAX_AGE_SECONDS:180}
      exporter-secret: ${MATERIAL_PROVIDER_CAPACITY_EXPORTER_SECRET:}

# Product chat is V2-only when the lifecycle and product ingress are explicitly enabled.
turn-engine:
  lifecycle:
    enabled: ${TURN_ENGINE_LIFECYCLE_ENABLED:false}
  execution:
    # Explicitly composes the complete V2 planning and attempt-runner graph.
    enabled: ${TURN_ENGINE_V2_EXECUTION_ENABLED:false}
  http:
    product-v2-ingress:
      enabled: ${TURN_ENGINE_PRODUCT_V2_INGRESS_ENABLED:false}
      # Direct image reconstruction can require a visual pass followed by generation.
      timeout-millis: ${TURN_ENGINE_PRODUCT_V2_INGRESS_TIMEOUT_MILLIS:180000}
  migration:
    startup-target-mode: ${TURN_ENGINE_MIGRATION_STARTUP_TARGET_MODE:}
  canary:
    rollout-percent: ${TURN_ENGINE_CANARY_ROLLOUT_PERCENT:0}

# Actuator only exposes health and Prometheus metrics. Production must restrict /actuator/prometheus
# at the network or reverse-proxy layer so it is reachable by Prometheus, not public users.
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.config.name:ai-agent-draw-io-app}
    distribution:
      percentiles-histogram:
        ai.agent.run.latency: true
        ai.agent.llm.call.latency: true
        ai.agent.tool.call.latency: true

zipp:
  turn:
    v2:
      # V2 generation capabilities are composed as one product path.
      plain-agent-id: ${TURN_V2_PLAIN_AGENT_ID:300025}
      # The bounded loop is active by default; set the environment value to one-shot for rollback.
      plain-generation-mode: ${TURN_V2_PLAIN_GENERATION_MODE:agentic}
      grounded-agent-id: ${TURN_V2_GROUNDED_AGENT_ID:300027}
      evidence-agent-id: ${TURN_V2_EVIDENCE_AGENT_ID:300028}
  visual-review:
    # Every persisted V2 drawing is reviewed from its real browser render. The explicit flags remain
    # the main gate; percentages are optional production canaries rather than hidden local blockers.
    enabled: ${ZIPP_VISUAL_REVIEW_ENABLED:false}
    auto-repair-enabled: ${ZIPP_VISUAL_REVIEW_AUTO_REPAIR_ENABLED:false}
    rollout-percent: ${ZIPP_VISUAL_REVIEW_ROLLOUT_PERCENT:100}
    round-1-rollout-percent: ${ZIPP_VISUAL_REVIEW_ROUND_1_ROLLOUT_PERCENT:100}
    round-2-rollout-percent: ${ZIPP_VISUAL_REVIEW_ROUND_2_ROLLOUT_PERCENT:100}
    repair-agent-id: ${ZIPP_VISUAL_REPAIR_AGENT_ID:300029}
    # Allow slow image reviews while staying below the 120-second streaming response timeout.
    timeout-ms: ${ZIPP_VISUAL_REVIEW_TIMEOUT_MS:60000}
    model-version: ${VLM_MODEL:${LLM_MODEL:gpt-5.5}}
    request-threads: ${ZIPP_VISUAL_REVIEW_REQUEST_THREADS:4}
    request-queue-capacity: ${ZIPP_VISUAL_REVIEW_REQUEST_QUEUE_CAPACITY:50}
    call-threads: ${ZIPP_VISUAL_REVIEW_CALL_THREADS:2}
    call-queue-capacity: ${ZIPP_VISUAL_REVIEW_CALL_QUEUE_CAPACITY:20}
  telemetry:
    # Enable this on exactly one app instance, or run cleanup from a dedicated scheduler.
    cleanup-enabled: ${ZIPP_TELEMETRY_CLEANUP_ENABLED:false}
    # Local trace analysis captures every new run by default; production can explicitly disable payload storage.
    debug-payload-capture-enabled: ${ZIPP_TELEMETRY_DEBUG_PAYLOAD_CAPTURE_ENABLED:true}
    retention-days: ${ZIPP_TELEMETRY_RETENTION_DAYS:30}
    cleanup-cron: "${ZIPP_TELEMETRY_CLEANUP_CRON:0 30 3 * * *}"
    delete-batch-size: ${ZIPP_TELEMETRY_DELETE_BATCH_SIZE:500}
  evaluation:
    # Bump this non-secret identifier whenever the text provider or endpoint contract changes.
    text-provider-version: ${EVAL_TEXT_LLM_PROVIDER_VERSION:unconfigured}
    # Run metadata-only candidate discovery on one scheduler instance; no debug payload or LLM access.
    candidate-selector-enabled: ${ZIPP_EVAL_CANDIDATE_SELECTOR_ENABLED:false}
    candidate-selector-delay-ms: ${ZIPP_EVAL_CANDIDATE_SELECTOR_DELAY_MS:300000}
    # Enable on one scheduler instance after Eval Run persistence is configured.
    case-health-job-enabled: ${ZIPP_EVAL_CASE_HEALTH_JOB_ENABLED:false}
    case-health-job-cron: "${ZIPP_EVAL_CASE_HEALTH_JOB_CRON:0 30 2 * * *}"
    # Live execution and every model-backed Judge remain unavailable until explicitly configured.
    live-enabled: ${ZIPP_EVAL_LIVE_ENABLED:false}
    live-timeout-ms: ${ZIPP_EVAL_LIVE_TIMEOUT_MS:120000}
    draft-agent-id: ${ZIPP_EVAL_DRAFT_AGENT_ID:300013}
    draft-model-version: ${ZIPP_EVAL_DRAFT_MODEL_VERSION:unconfigured}
    draft-temperature: ${ZIPP_EVAL_DRAFT_TEMPERATURE:0}
    judge-agent-id: ${ZIPP_EVAL_JUDGE_AGENT_ID:300014}
    judge-model-version: ${ZIPP_EVAL_JUDGE_MODEL_VERSION:unconfigured}
    judge-temperature: ${ZIPP_EVAL_JUDGE_TEMPERATURE:0}
    judge-calibration-approved: ${ZIPP_EVAL_JUDGE_CALIBRATION_APPROVED:false}
    judge-calibration-version: ${ZIPP_EVAL_JUDGE_CALIBRATION_VERSION:unconfigured}
    judge-calibrated-version: ${ZIPP_EVAL_JUDGE_CALIBRATED_VERSION:unconfigured}
    # Semantic discovery stays fail-closed until its exact model/prompt/schema version is calibrated.
    semantic-miner-enabled: ${ZIPP_EVAL_SEMANTIC_MINER_ENABLED:false}
    semantic-miner-calibration-approved: ${ZIPP_EVAL_SEMANTIC_MINER_CALIBRATION_APPROVED:false}
    semantic-miner-agent-id: ${ZIPP_EVAL_SEMANTIC_MINER_AGENT_ID:300015}
    semantic-miner-model-version: ${ZIPP_EVAL_SEMANTIC_MINER_MODEL_VERSION:unconfigured}
    semantic-miner-temperature: ${ZIPP_EVAL_SEMANTIC_MINER_TEMPERATURE:0}
    semantic-miner-prompt-version: ${ZIPP_EVAL_SEMANTIC_MINER_PROMPT_VERSION:semantic-miner-prompt-v1}
    semantic-miner-schema-version: ${ZIPP_EVAL_SEMANTIC_MINER_SCHEMA_VERSION:semantic-miner-schema-v1}
    semantic-miner-calibrated-version: ${ZIPP_EVAL_SEMANTIC_MINER_CALIBRATED_VERSION:unconfigured}
    semantic-miner-max-samples: ${ZIPP_EVAL_SEMANTIC_MINER_MAX_SAMPLES:50}
    semantic-miner-estimated-cost-per-analysis-usd: ${ZIPP_EVAL_SEMANTIC_MINER_COST_PER_ANALYSIS_USD:0}
    semantic-miner-timeout-ms: ${ZIPP_EVAL_SEMANTIC_MINER_TIMEOUT_MS:30000}
    semantic-miner-call-threads: ${ZIPP_EVAL_SEMANTIC_MINER_CALL_THREADS:2}
    # Visual discovery and scoring use separate multimodal Agents and independent calibration records.
    visual-judge-agent-id: ${ZIPP_EVAL_VISUAL_JUDGE_AGENT_ID:300016}
    visual-judge-model-version: ${ZIPP_EVAL_VISUAL_JUDGE_MODEL_VERSION:unconfigured}
    visual-judge-temperature: ${ZIPP_EVAL_VISUAL_JUDGE_TEMPERATURE:0}
    visual-judge-calibration-approved: ${ZIPP_EVAL_VISUAL_JUDGE_CALIBRATION_APPROVED:false}
    visual-judge-calibration-version: ${ZIPP_EVAL_VISUAL_JUDGE_CALIBRATION_VERSION:unconfigured}
    visual-judge-calibrated-version: ${ZIPP_EVAL_VISUAL_JUDGE_CALIBRATED_VERSION:unconfigured}
    visual-miner-agent-id: ${ZIPP_EVAL_VISUAL_MINER_AGENT_ID:300017}
    visual-miner-enabled: ${ZIPP_EVAL_VISUAL_MINER_ENABLED:false}
    visual-miner-model-version: ${ZIPP_EVAL_VISUAL_MINER_MODEL_VERSION:unconfigured}
    visual-miner-temperature: ${ZIPP_EVAL_VISUAL_MINER_TEMPERATURE:0}
    visual-miner-calibration-approved: ${ZIPP_EVAL_VISUAL_MINER_CALIBRATION_APPROVED:false}
    visual-miner-calibrated-version: ${ZIPP_EVAL_VISUAL_MINER_CALIBRATED_VERSION:unconfigured}
    visual-miner-max-image-bytes: ${ZIPP_EVAL_VISUAL_MINER_MAX_IMAGE_BYTES:2000000}
    visual-miner-estimated-cost-per-analysis-usd: ${ZIPP_EVAL_VISUAL_MINER_COST_PER_ANALYSIS_USD:0}
    visual-miner-timeout-ms: ${ZIPP_EVAL_VISUAL_MINER_TIMEOUT_MS:90000}
    visual-miner-call-threads: ${ZIPP_EVAL_VISUAL_MINER_CALL_THREADS:1}
    live-agent-id: ${ZIPP_EVAL_LIVE_AGENT_ID:300000}
    # Release-only dataset must be mounted outside the product repository.
    sequestered-root: ${ZIPP_EVAL_SEQUESTERED_ROOT:}
    minimum-sequestered-cases: ${ZIPP_EVAL_MIN_SEQUESTERED_CASES:20}
    # Published synthetic artifacts must live outside the product Git checkout.
    artifact-root: ${ZIPP_EVAL_ARTIFACT_ROOT:${java.io.tmpdir}/freedraw-eval-artifacts}

