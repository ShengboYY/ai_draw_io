spring:
  config:
    name: ai-agent-draw-io-app
  profiles:
    active: dev

# 会话身份 (#3): 7 天登录有效期; cookie HttpOnly + SameSite=Lax，并由 CSRF token 保护写操作。
# 生产 profile 必须覆盖 server.servlet.session.cookie.secure=true (HTTPS-only)，
# 该 override 已在 application-prod.yml (gitignored) 中配置。
server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: AI_DRAWIO_SID
        http-only: true
        same-site: lax
        secure: false

# Account links rendered by the console email adapter in local development.
account:
  password-reset:
    base-url: ${ACCOUNT_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password/confirm}

# Comma/space separated normalized by the server. Empty means no admin access.
admin:
  emails: ${ADMIN_EMAILS:}
  allowed-origins: ${ADMIN_ALLOWED_ORIGINS:}

app:
  security:
    # Credentialed CORS is restricted to known SPA origins; production should set this env var.
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# MyBatis mapper 全量列表放这里，避免每份 profile 重复维护；profile 里可再叠加自定义。
mybatis:
  mapper-locations:
    - classpath:/mybatis/mapper/skill_mapper.xml
    - classpath:/mybatis/mapper/canvas_state_mapper.xml
    - classpath:/mybatis/mapper/diagram_conversation_mapper.xml
    - classpath:/mybatis/mapper/user_account_mapper.xml
    - classpath:/mybatis/mapper/account_token_mapper.xml
    - classpath:/mybatis/mapper/model_credential_mapper.xml
    - classpath:/mybatis/mapper/agent_usage_telemetry_mapper.xml
    - classpath:/mybatis/mapper/admin_audit_log_mapper.xml
    - classpath:/mybatis/mapper/agent_debug_trace_mapper.xml
    - classpath:/mybatis/mapper/usage_counter_mapper.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml
