# Local development services for the backend project.
services:
  db:
    image: mysql:8.4
    container_name: ai-agent-draw-io
    restart: unless-stopped
    environment:
      # MySQL creates this database on the first container startup.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_draw_io}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      TZ: ${MYSQL_TZ:-UTC}
    ports:
      # Host apps connect through 127.0.0.1:${MYSQL_PORT}; Docker services use db:3306.
      - "${MYSQL_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    volumes:
      # Keep local dev data after container restarts.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
