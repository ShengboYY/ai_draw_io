name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  backend-ci:
    name: backend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ai-agent-draw-io/**/pom.xml

      - name: Run backend tests
        run: >-
          mvn -B
          -s ai-agent-draw-io/docker/maven-settings.xml
          -f ai-agent-draw-io/pom.xml
          -pl ai-agent-draw-io-app -am
          test

  frontend-ci:
    name: frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ai-agent-draw-io-front

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai-agent-draw-io-front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: node --experimental-strip-types --test tests/*.test.mjs scripts/*.test.mjs

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  container-check:
    name: container-check
    if: github.event_name == 'pull_request'
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Fargate currently runs the x86_64 task definitions, so CI verifies amd64 images.
      - name: Build backend image
        run: >-
          docker build
          --platform linux/amd64
          --tag ai-drawio-backend:ci
          ai-agent-draw-io

      - name: Build frontend image
        run: >-
          docker build
          --platform linux/amd64
          --tag ai-drawio-frontend:ci
          ai-agent-draw-io-front
