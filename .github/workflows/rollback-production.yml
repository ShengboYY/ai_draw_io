name: Roll Back Production Backend

on:
  workflow_dispatch:
    inputs:
      backend_task_definition:
        description: Previous backend task definition ARN or family:revision
        required: true
        type: string
      reason:
        description: Why this rollback is required
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    name: rollback-production-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://freedrawai.com
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      PRODUCTION_API_BASE_URL: https://api.freedrawai.com/api/v1
      BACKEND_TASK_DEFINITION: ${{ inputs.backend_task_definition }}
      ROLLBACK_REASON: ${{ inputs.reason }}

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ai-drawio-rollback-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Validate rollback revision
        shell: bash
        run: |
          set -euo pipefail
          account_id=$(aws sts get-caller-identity --query Account --output text)
          task_json=$(aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            --output json)
          family=$(jq -r '.taskDefinition.family' <<< "$task_json")
          image=$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "backend") | .image' <<< "$task_json")
          expected="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPOSITORY}:"

          if [[ "$family" != "$ECS_BACKEND_TASK_FAMILY" || "$image" != "$expected"* ]]; then
            echo "Rollback task definition is outside the approved backend family or ECR repository." >&2
            exit 1
          fi

      - name: Save current revision
        id: current
        shell: bash
        run: |
          set -euo pipefail
          current=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "task_definition=$current" >> "$GITHUB_OUTPUT"

      - name: Restore selected backend revision
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE"

      - name: Smoke test restored API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 10 --retry-all-errors \
            --user-agent "FreeDrawAI-RollbackCheck/2.0" \
            "${PRODUCTION_API_BASE_URL}/query_ai_agent_config_list" \
            > /dev/null

      - name: Write rollback summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production backend rollback succeeded"
            echo ""
            echo "- Backend task: \`${BACKEND_TASK_DEFINITION}\`"
            echo "- Reason: ${ROLLBACK_REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore starting revision if rollback fails
        if: ${{ failure() && steps.current.outputs.task_definition != '' }}
        env:
          STARTING_BACKEND: ${{ steps.current.outputs.task_definition }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$STARTING_BACKEND" \
            > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE"
