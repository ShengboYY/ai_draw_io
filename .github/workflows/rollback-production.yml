name: Roll Back Production

on:
  workflow_dispatch:
    inputs:
      backend_task_definition:
        description: Previous backend task definition ARN or family:revision
        required: true
        type: string
      frontend_task_definition:
        description: Previous frontend task definition ARN or family:revision
        required: true
        type: string
      reason:
        description: Why this rollback is required
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    name: rollback-production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      ECS_BACKEND_TASK_FAMILY: ${{ vars.ECS_BACKEND_TASK_FAMILY }}
      ECS_FRONTEND_TASK_FAMILY: ${{ vars.ECS_FRONTEND_TASK_FAMILY }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      BACKEND_TASK_DEFINITION: ${{ inputs.backend_task_definition }}
      FRONTEND_TASK_DEFINITION: ${{ inputs.frontend_task_definition }}
      ROLLBACK_REASON: ${{ inputs.reason }}

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ai-drawio-rollback-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Validate rollback task definitions
        shell: bash
        run: |
          set -euo pipefail

          account_id=$(aws sts get-caller-identity --query Account --output text)
          backend_json=$(aws ecs describe-task-definition --task-definition "$BACKEND_TASK_DEFINITION" --output json)
          frontend_json=$(aws ecs describe-task-definition --task-definition "$FRONTEND_TASK_DEFINITION" --output json)

          backend_family=$(jq -r '.taskDefinition.family' <<< "$backend_json")
          frontend_family=$(jq -r '.taskDefinition.family' <<< "$frontend_json")
          backend_image=$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "backend") | .image' <<< "$backend_json")
          frontend_image=$(jq -r '.taskDefinition.containerDefinitions[] | select(.name == "frontend") | .image' <<< "$frontend_json")

          if [[ "$backend_family" != "$ECS_BACKEND_TASK_FAMILY" ]]; then
            echo "Unexpected backend task family: $backend_family" >&2
            exit 1
          fi
          if [[ "$frontend_family" != "$ECS_FRONTEND_TASK_FAMILY" ]]; then
            echo "Unexpected frontend task family: $frontend_family" >&2
            exit 1
          fi

          expected_backend="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPOSITORY}:"
          expected_frontend="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPOSITORY}:"
          if [[ "$backend_image" != "$expected_backend"* ]]; then
            echo "Backend rollback image is outside the approved ECR repository" >&2
            exit 1
          fi
          if [[ "$frontend_image" != "$expected_frontend"* ]]; then
            echo "Frontend rollback image is outside the approved ECR repository" >&2
            exit 1
          fi

      - name: Save current service revisions
        id: current
        shell: bash
        run: |
          set -euo pipefail

          current_backend=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          current_frontend=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "backend_task_definition=$current_backend" >> "$GITHUB_OUTPUT"
          echo "frontend_task_definition=$current_frontend" >> "$GITHUB_OUTPUT"

      - name: Restore selected revisions
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            > /dev/null
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "$FRONTEND_TASK_DEFINITION" \
            > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"

      - name: Smoke test restored application
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors \
            --user-agent "FreeDrawAI-RollbackCheck/1.0" \
            "$PRODUCTION_BASE_URL/api/v1/query_ai_agent_config_list" \
            > /dev/null
          curl --fail --silent --show-error --location --retry 10 --retry-delay 10 --retry-all-errors \
            --user-agent "FreeDrawAI-RollbackCheck/1.0" \
            "$PRODUCTION_BASE_URL/" \
            > /dev/null

      - name: Write rollback summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production rollback succeeded"
            echo ""
            echo "- Backend task: \`${BACKEND_TASK_DEFINITION}\`"
            echo "- Frontend task: \`${FRONTEND_TASK_DEFINITION}\`"
            echo "- Reason: ${ROLLBACK_REASON}"
            echo "- URL: ${PRODUCTION_BASE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore starting revisions if rollback fails
        if: ${{ failure() && steps.current.outputs.backend_task_definition != '' && steps.current.outputs.frontend_task_definition != '' }}
        env:
          STARTING_BACKEND: ${{ steps.current.outputs.backend_task_definition }}
          STARTING_FRONTEND: ${{ steps.current.outputs.frontend_task_definition }}
        shell: bash
        run: |
          set -euo pipefail

          # A failed rollback must not leave production on a partially changed backend/frontend pair.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$STARTING_BACKEND" \
            > /dev/null
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "$STARTING_FRONTEND" \
            > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"

