name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full 40-character Git SHA already published to ECR
        required: true
        type: string
      database_change:
        description: Confirm the database migration state for this release
        required: true
        default: no-database-change
        type: choice
        options:
          - no-database-change
          - migration-completed

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      IMAGE_TAG: sha-${{ inputs.release_sha }}
      DATABASE_CHANGE: ${{ inputs.database_change }}
      ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

    steps:
      - name: Validate release input
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase 40-character Git SHA" >&2
            exit 1
          fi

          case "$DATABASE_CHANGE" in
            no-database-change|migration-completed)
              ;;
            *)
              echo "Invalid database_change value" >&2
              exit 1
              ;;
          esac

      - name: Checkout selected release
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify release belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ai-drawio-deploy-${{ github.run_id }}
          role-duration-seconds: 3600
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Resolve release image URIs
        id: images
        shell: bash
        run: |
          set -euo pipefail

          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "backend_image=${registry}/${ECR_BACKEND_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${registry}/${ECR_FRONTEND_REPOSITORY}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release images and scan results
        shell: bash
        run: |
          set -euo pipefail

          # Both containers must come from the same tested commit, and neither scan may contain High/Critical findings.
          for repository in "$ECR_BACKEND_REPOSITORY" "$ECR_FRONTEND_REPOSITORY"; do
            digest=$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids imageTag="$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)

            scan_status=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanStatus.status' \
              --output text)
            critical=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
              --output text)
            high=$(aws ecr describe-image-scan-findings \
              --repository-name "$repository" \
              --image-id imageTag="$IMAGE_TAG" \
              --query 'imageScanFindings.findingSeverityCounts.HIGH' \
              --output text)

            [[ "$critical" == "None" ]] && critical=0
            [[ "$high" == "None" ]] && high=0

            if [[ "$scan_status" != "COMPLETE" ]]; then
              echo "Image scan is not complete for ${repository}:${IMAGE_TAG}: ${scan_status}" >&2
              exit 1
            fi

            if (( critical > 0 || high > 0 )); then
              echo "Blocking ${repository}:${IMAGE_TAG}; scan has Critical=${critical}, High=${high}" >&2
              exit 1
            fi

            echo "Verified ${repository}:${IMAGE_TAG} at ${digest}"
          done

      - name: Save current service revisions
        id: previous
        shell: bash
        run: |
          set -euo pipefail

          previous_backend=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          previous_frontend=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_FRONTEND_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ "$previous_backend" == "None" || "$previous_frontend" == "None" ]]; then
            echo "Unable to resolve current ECS task definitions" >&2
            exit 1
          fi

          echo "backend_task_definition=$previous_backend" >> "$GITHUB_OUTPUT"
          echo "frontend_task_definition=$previous_frontend" >> "$GITHUB_OUTPUT"

      - name: Download current task definitions
        env:
          PREVIOUS_BACKEND: ${{ steps.previous.outputs.backend_task_definition }}
          PREVIOUS_FRONTEND: ${{ steps.previous.outputs.frontend_task_definition }}
        shell: bash
        run: |
          set -euo pipefail

          # Start from the revisions actually serving production, not an unverified newer family revision.
          aws ecs describe-task-definition \
            --task-definition "$PREVIOUS_BACKEND" \
            --query taskDefinition \
            --output json \
            | jq '{
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                pidMode,
                ipcMode,
                proxyConfiguration,
                inferenceAccelerators,
                ephemeralStorage,
                runtimePlatform
              } | with_entries(select(.value != null))' \
            > "$RUNNER_TEMP/backend-task-definition.json"

          aws ecs describe-task-definition \
            --task-definition "$PREVIOUS_FRONTEND" \
            --query taskDefinition \
            --output json \
            | jq '{
                family,
                taskRoleArn,
                executionRoleArn,
                networkMode,
                containerDefinitions,
                volumes,
                placementConstraints,
                requiresCompatibilities,
                cpu,
                memory,
                pidMode,
                ipcMode,
                proxyConfiguration,
                inferenceAccelerators,
                ephemeralStorage,
                runtimePlatform
              } | with_entries(select(.value != null))' \
            > "$RUNNER_TEMP/frontend-task-definition.json"

      - name: Render backend task definition
        id: render-backend
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ${{ runner.temp }}/backend-task-definition.json
          container-name: backend
          image: ${{ steps.images.outputs.backend_image }}

      - name: Deploy backend
        id: deploy-backend
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_BACKEND_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke test backend through ALB
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --user-agent "FreeDrawAI-DeploymentCheck/1.0" \
            "$PRODUCTION_BASE_URL/api/v1/query_ai_agent_config_list" \
            > /dev/null

      - name: Render frontend task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        with:
          task-definition: ${{ runner.temp }}/frontend-task-definition.json
          container-name: frontend
          image: ${{ steps.images.outputs.frontend_image }}

      - name: Deploy frontend
        id: deploy-frontend
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_FRONTEND_SERVICE }}
          wait-for-service-stability: true

      - name: Smoke test frontend through Cloudflare and ALB
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            --user-agent "FreeDrawAI-DeploymentCheck/1.0" \
            "$PRODUCTION_BASE_URL/" \
            > /dev/null

      - name: Write successful deployment summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production deployment succeeded"
            echo ""
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Image tag: \`${IMAGE_TAG}\`"
            echo "- Database gate: \`${DATABASE_CHANGE}\`"
            echo "- Previous backend task: \`${{ steps.previous.outputs.backend_task_definition }}\`"
            echo "- Previous frontend task: \`${{ steps.previous.outputs.frontend_task_definition }}\`"
            echo "- URL: ${PRODUCTION_BASE_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore both services after a failed deployment or smoke test
        if: ${{ failure() && steps.previous.outputs.backend_task_definition != '' && steps.previous.outputs.frontend_task_definition != '' }}
        env:
          PREVIOUS_BACKEND: ${{ steps.previous.outputs.backend_task_definition }}
          PREVIOUS_FRONTEND: ${{ steps.previous.outputs.frontend_task_definition }}
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$PREVIOUS_BACKEND" \
            > /dev/null
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_FRONTEND_SERVICE" \
            --task-definition "$PREVIOUS_FRONTEND" \
            > /dev/null
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"

          {
            echo "## Automatic rollback requested"
            echo ""
            echo "- Backend restored to: \`${PREVIOUS_BACKEND}\`"
            echo "- Frontend restored to: \`${PREVIOUS_FRONTEND}\`"
          } >> "$GITHUB_STEP_SUMMARY"

