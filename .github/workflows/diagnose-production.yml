name: Diagnose Production ECS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose-production-ecs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_BACKEND_SERVICE: ${{ vars.ECS_BACKEND_SERVICE }}
      ECS_FRONTEND_SERVICE: ${{ vars.ECS_FRONTEND_SERVICE }}

    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ai-drawio-diagnose-${{ github.run_id }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Read ECS deployment events
        shell: bash
        run: |
          set -euo pipefail

          # Service events retain the circuit-breaker reason without granting access to application secrets.
          for service in "$ECS_BACKEND_SERVICE" "$ECS_FRONTEND_SERVICE"; do
            echo "::group::$service"
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$service" \
              --query 'services[0].{serviceName:serviceName,taskDefinition:taskDefinition,desiredCount:desiredCount,runningCount:runningCount,pendingCount:pendingCount,healthCheckGracePeriodSeconds:healthCheckGracePeriodSeconds,deployments:deployments,events:events[:20]}' \
              --output json
            echo "::endgroup::"
          done

      - name: Read recent backend task failures
        shell: bash
        run: |
          set -euo pipefail

          # Task stop reasons distinguish startup failures from load-balancer health-check failures.
          mapfile -t task_ids < <(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_BACKEND_SERVICE" \
              --query 'services[0].events[].message' \
              --output text \
              | grep -Eo 'task [0-9a-f]{32}' \
              | awk '{print $2}' \
              | awk '!seen[$0]++' \
              | head -n 10
          )

          if (( ${#task_ids[@]} == 0 )); then
            echo "No recent backend task IDs were found in the ECS service events."
            exit 0
          fi

          aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "${task_ids[@]}" \
            --query 'tasks[].{taskArn:taskArn,taskDefinitionArn:taskDefinitionArn,lastStatus:lastStatus,stopCode:stopCode,stoppedReason:stoppedReason,stoppedAt:stoppedAt,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}' \
            --output json
